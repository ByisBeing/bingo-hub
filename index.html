<script>
// ═══════════════ INLINE CONFETTI (no CDN needed) ═══════════════
function confetti(opts){
  opts=opts||{};var count=opts.particleCount||80;var spread=opts.spread||70;
  var colors=opts.colors||['#e8a0b4','#f0d58c','#8cc9a8','#d4eaf5'];
  var originX=(opts.origin&&opts.origin.x)||0.5;var originY=(opts.origin&&opts.origin.y)||0.5;
  var canvas=document.createElement('canvas');canvas.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9999';
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;document.body.appendChild(canvas);
  var ctx=canvas.getContext('2d');var particles=[];
  for(var i=0;i<count;i++){
    particles.push({x:canvas.width*originX,y:canvas.height*originY,
      vx:(Math.random()-0.5)*spread*0.15,vy:-(Math.random()*8+4),
      size:Math.random()*8+4,color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360,rotV:(Math.random()-0.5)*10,life:1,decay:0.008+Math.random()*0.02})
  }
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);var alive=false;
    for(var i=0;i<particles.length;i++){var p=particles[i];if(p.life<=0)continue;alive=true;
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.rot+=p.rotV;p.life-=p.decay;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;ctx.globalAlpha=p.life;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);ctx.restore()}
    if(alive)requestAnimationFrame(animate);else{canvas.remove()}
  }
  animate()
}

// ═══════════════ SVG PIE CHART (no Chart.js needed) ═══════════════
function drawPieChart(containerId,data){
  var el=document.getElementById(containerId);if(!el||!data||!data.labels||!data.labels.length)return;
  var colors=data.colors||['#e8a0b4','#f0b57c','#8cc9a8','#7bb8d4','#f0d58c','#c5bfb6'];
  var total=data.values.reduce(function(a,b){return a+b},0);
  var w=el.clientWidth||260;var r=Math.min(w,160)/2;var cx=w/2;var cy=r+4;
  var svg='<svg width="'+w+'" height="'+(r*2+40)+'" xmlns="http://www.w3.org/2000/svg">';
  var angle=-Math.PI/2;var legendX=10;var legendY=r*2+12;
  for(var i=0;i<data.labels.length;i++){
    var slice=((data.values[i]/total)*Math.PI*2);
    var x1=cx+r*Math.cos(angle);var y1=cy+r*Math.sin(angle);angle+=slice;
    var x2=cx+r*Math.cos(angle);var y2=cy+r*Math.sin(angle);
    var large=slice>Math.PI?1:0;
    svg+='<path d="M'+cx+','+cy+' L'+x1+','+y1+' A'+r+','+r+' 0 '+large+',1 '+x2+','+y2+'Z" fill="'+colors[i%colors.length]+'" opacity="0.85"/>';
    var pct=Math.round(data.values[i]/total*100);
    svg+='<rect x="'+legendX+'" y="'+legendY+'" width="10" height="10" rx="2" fill="'+colors[i%colors.length]+'"/>';
    svg+='<text x="'+(legendX+14)+'" y="'+(legendY+9)+'" font-size="10" fill="#666">'+data.labels[i]+' '+pct+'%</text>';
    legendX+=data.labels[i].length*12+50;if(legendX>w-60){legendX=10;legendY+=16}
  }
  svg+='</svg>';el.innerHTML=svg
}
</script>

function h(todayStr){const d=new Date(todayStr);const m=d.getMonth()+1;const dy=d.getDate();const w=['日','一','二','三','四','五','六'][d.getDay()];return m+'月'+dy+'日 周'+w}
function greet(){const h=now().getHours();if(h<12)return'早上好';if(h<17)return'下午好';return'晚上好'}
function icon(c){return'<span style="font-size:22px">'+c+'</span>'}

// ═══════════════ RENDER ═══════════════
function render(){document.getElementById('app').innerHTML=`
<div class="page active" id="page-home">${homePage()}</div>
<div class="page" id="page-cal">${calPage()}</div>
<div class="page" id="page-task">${taskPage()}</div>
<div class="page" id="page-study">${studyPage()}</div>
<div class="page" id="page-review">${reviewPage()}</div>
`;document.getElementById('navbar').innerHTML=navHTML();
attachEvents();}

function navHTML(){const tabs=[{i:'📋',t:'首页'},{i:'📅',t:'日程'},{i:'✅',t:'任务'},{i:'📝',t:'学习'},{i:'📖',t:'复盘'}];
return tabs.map((tb,k)=>`<button class="nav-item${k===0?' active':''}" data-tab="${k}"><span class="icon">${tb.i}</span>${tb.t}</button>`).join('')}

// ─── TAB 1: HOME ───
function homePage(){const td=today();const te=S.events.filter(e=>e.date===td).sort((a,b)=>a.time.localeCompare(b.time));
const ct=S.countdowns.map(c=>({...c,days:daysBetween(td,c.date)})).filter(c=>c.days>=0).sort((a,b)=>a.days-b.days);
const cdColor=c=>c.days<=7?'#e8a0b4':c.days<=30?'var(--orange2)':'var(--green2)';
return`
<div style="padding-top:8px">
  <div style="font-size:28px;font-weight:800;letter-spacing:-0.5px">${h(td)}</div>
  <div style="font-size:16px;color:var(--text2);margin-top:2px">${greet()}，比十乃又皿 🌸</div>
  <div style="margin-top:10px;padding:10px 14px;background:linear-gradient(135deg,rgba(232,160,180,0.12),rgba(140,201,168,0.12));border-radius:12px;font-size:11px;color:var(--text2);display:flex;align-items:center;gap:8px">
    <span style="font-size:20px">🎯</span><span><b>华师 → 人大金融专硕</b> · 高绩点 · 数学竞赛 · 四级600+ · 保研上岸</span>
  </div>
</div>
<div class="card" style="margin-top:14px">
  <h3>📌 今日日程</h3>
  <div class="timeline">${te.length?te.map(e=>`
    <div class="tl-item">
      <div class="tl-time">${e.time} <span class="tag tag-${e.type==='exam'?'exam':e.type==='hw'?'hw':e.type==='club'?'club':'life'}">${e.type==='exam'?'考试':e.type==='hw'?'作业':e.type==='club'?'学生会':'生活'}</span></div>
      <div class="tl-title">${e.title}</div>
      <div class="tl-desc">📍 ${e.loc}</div>
    </div>`).join(''):'<div style="color:var(--text2);font-size:13px;padding:8px 0">🎉 今天没有安排，自由学习吧~</div>'}</div>
</div>
<div class="card">
  <h3>✅ 今日核心任务</h3>
  ${S.tasks.filter(t=>!t.done).slice(0,5).map(t=>`
    <div class="check-row"><input type="checkbox" id="t${t.id}" ${t.done?'checked':''} data-tid="${t.id}"><label class="check-box" for="t${t.id}">✓</label><span class="check-label">${['🔴','🟡','🟢'][t.id%3]} ${t.title}</span></div>
  `).join('')}
  ${S.tasks.filter(t=>t.done).slice(0,3).map(t=>`
    <div class="check-row"><input type="checkbox" id="t${t.id}" checked data-tid="${t.id}"><label class="check-box" for="t${t.id}">✓</label><span class="check-label" style="text-decoration:line-through;color:var(--gray2)">✅ ${t.title}</span></div>
  `).join('')}
</div>
<div class="card">
  <h3>⏳ 倒计时 <span style="font-size:12px;font-weight:400;color:var(--text2);cursor:pointer" onclick="addCountdown()">+ 添加</span></h3>
  <div class="countdown-row">${ct.map(c=>`
    <div class="cd-card" style="background:${cdColor(c)}15;position:relative">
      <span style="position:absolute;top:4px;right:8px;font-size:14px;color:var(--gray2);cursor:pointer" onclick="event.stopPropagation();delCountdown(${c.id})">×</span>
      <div class="cd-num" style="color:${cdColor(c)}">${c.days}</div>
      <div style="font-size:13px;font-weight:600">${c.title}</div>
      <div class="cd-label">天后</div>
    </div>
  `).join('')}</div>
</div>`;
}

// ─── TAB 2: CALENDAR ───
var calOffset=0; // months from current
function calPage(){var td=today();var d=new Date(now().getFullYear(),now().getMonth()+calOffset,1);var y=d.getFullYear();var m=d.getMonth();
const firstDay=new Date(y,m,1).getDay();const daysInMonth=new Date(y,m+1,0).getDate();
const days=[];for(let i=0;i<firstDay;i++)days.push(null);for(let i=1;i<=daysInMonth;i++)days.push(i);
const eventDays={};S.events.forEach(e=>{const d=e.date.split('-')[2];if(e.date.startsWith(y+'-'+fmt(m+1)))eventDays[parseInt(d)]=true});
let calHTML='<div class="cal-header"><button class="btn btn-ghost btn-sm" onclick="changeMonth(-1)">◀</button><span style="font-weight:700">'+y+'年'+(m+1)+'月</span><button class="btn btn-ghost btn-sm" onclick="changeMonth(1)">▶</button></div>';
calHTML+='<div class="cal-grid">'+['日','一','二','三','四','五','六'].map(d=>'<div class="cal-day-hd">'+d+'</div>').join('');
calHTML+=days.map((d,i)=>{
  if(!d)return'<div class="cal-cell other"></div>';
  const ds=y+'-'+fmt(m+1)+'-'+fmt(d);const isToday=ds===td;const hasEv=eventDays[d];
  return`<div class="cal-cell${isToday?' today':''}" data-date="${ds}" onclick="selectDate('${ds}')">${d}${hasEv?'<div class="cal-dot"></div>':''}</div>`;
}).join('')+'</div>';
calHTML+='<div id="selectedEvents" style="margin-top:12px"></div>';

// DDL warning
const ddl=S.events.filter(e=>{const diff=daysBetween(td,e.date);return diff>=0&&diff<=7&&e.type==='exam'}).sort((a,b)=>a.date.localeCompare(b.date));
calHTML+=ddl.length?`<div class="card" style="margin-top:12px;background:linear-gradient(135deg,#fce4ec,#fde4cc)"><h3>🚨 7天DDL预警</h3>${ddl.map(e=>`<div style="font-size:13px;padding:4px 0">⏰ ${e.date} — ${e.title}</div>`).join('')}</div>`:'';

// Timetable
const weekDays=['一','二','三','四','五','六','日'];const periods=10;
let ttHTML='<div class="card" style="margin-top:12px"><h3>📅 周课表 <span style="font-size:12px;color:var(--text2)">暑假第1周</span></h3>';
ttHTML+='<div class="timetable"><div></div>'+weekDays.slice(0,5).map(d=>'<div class="tt-hd">周'+d+'</div>').join('');
for(let p=1;p<=periods;p++){
  ttHTML+='<div class="tt-period">'+p+'</div>';
  for(let d=1;d<=5;d++){
    const cs=S.courses.filter(c=>c.day===d&&c.start===p);
    if(cs.length){
      const c=cs[0];const h=Math.min(c.dur*28,84);
      ttHTML+=`<div class="tt-cell has-course" style="grid-row:span ${c.dur};height:${h}px" onclick="courseDetail(${c.id})">${c.name}<br><span style="font-size:9px;opacity:.7">${c.loc}</span></div>`;
    }else{ttHTML+='<div class="tt-cell"></div>'}
  }
}
ttHTML+='</div>';
// Course add form
ttHTML+=`<div style="margin-top:10px"><button class="btn btn-ghost btn-sm" onclick="toggleCourseForm()">+ 添加课程</button></div>
<div id="courseForm" style="display:none;margin-top:8px;background:rgba(255,255,255,0.7);border-radius:12px;padding:12px">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
    <input id="cName" placeholder="课程名" style="font-size:13px">
    <select id="cDay" style="font-size:13px"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option></select>
    <input id="cStart" type="number" placeholder="开始节次(1-10)" min="1" max="10" style="font-size:13px">
    <input id="cDur" type="number" placeholder="持续节数" min="1" max="5" value="2" style="font-size:13px">
    <input id="cLoc" placeholder="地点" style="font-size:13px">
    <input id="cTeacher" placeholder="教师" style="font-size:13px">
  </div>
  <button class="btn btn-primary btn-sm" style="width:100%;margin-top:8px" onclick="addCourse()">保存课程</button>
</div>`;
ttHTML+='</div>';
return calHTML+ttHTML;}

// ─── TAB 3: TASKS ───
function taskPage(){
const cats=[{k:'course',n:'📚 课程',bg:'var(--blue)'},{k:'club',n:'🎓 学生会',bg:'var(--green)'},{k:'personal',n:'👤 个人',bg:'var(--yellow)'},{k:'life',n:'🏠 生活',bg:'var(--gray)'}];
const kanban=cats.map(c=>`<div class="kb-col" style="background:${c.bg}40"><div class="kb-title">${c.n}</div><div class="kb-list" data-cat="${c.k}">${S.tasks.filter(t=>t.cat===c.k).map(t=>`
<div class="kb-card" data-id="${t.id}"><span>${t.title}</span><span class="tomato${t.tomato>0?' active':''}" onclick="event.stopPropagation();startTomato(${t.id})">🍅${t.tomato||''}</span><span class="del" onclick="event.stopPropagation();delTask(${t.id})">×</span></div>
`).join('')}</div><button class="btn btn-ghost btn-sm" style="width:100%;margin-top:6px" onclick="addTask('${c.k}')">+ 添加</button></div>`).join('');

// Finances
const thisMonth=now().getFullYear()+'-'+fmt(now().getMonth()+1);
const mf=S.finances.filter(f=>f.date.startsWith(thisMonth));
const totalIn=mf.filter(f=>f.type==='income').reduce((a,b)=>a+b.amount,0);
const totalOut=mf.filter(f=>f.type==='expense').reduce((a,b)=>a+b.amount,0);
const catOut={};mf.filter(f=>f.type==='expense').forEach(f=>{catOut[f.cat]=(catOut[f.cat]||0)+f.amount});
const finList=mf.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(f=>`
<div class="fin-item" id="fin-${f.id}"><div style="flex:1"><div style="font-size:13px;font-weight:500">${f.note||f.cat}</div><div style="font-size:11px;color:var(--text2)">${f.date} · ${f.cat}</div></div><div class="fin-amt ${f.type==='income'?'fin-in':'fin-out'}">${f.type==='income'?'+':'-'}¥${f.amount}</div><span style="font-size:14px;color:var(--gray2);cursor:pointer;padding:4px" onclick="delFinance(${f.id})">×</span></div>
`).join('');

return`
<div class="card"><h3>📋 任务看板</h3><div class="kanban-row">${kanban}</div></div>
<div class="card">
  <h3>💰 简易账本</h3>
  <div class="summary-row">
    <div class="sum-card"><div class="sum-val fin-in">+${totalIn}</div><div class="sum-label">收入</div></div>
    <div class="sum-card"><div class="sum-val fin-out">-${totalOut}</div><div class="sum-label">支出</div></div>
    <div class="sum-card"><div class="sum-val" style="color:${totalIn-totalOut>=0?'#4a9a6a':'#c06050'}">${totalIn-totalOut}</div><div class="sum-label">结余</div></div>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
    <select id="finType" style="width:auto;flex:1"><option value="expense">支出</option><option value="income">收入</option></select>
    <input id="finAmt" type="number" placeholder="金额" style="width:80px;flex:0">
    <select id="finCat" style="width:auto;flex:1"><option>餐饮</option><option>学习</option><option>交通</option><option>娱乐</option><option>生活费</option><option>其他</option></select>
  </div>
  <input id="finNote" placeholder="备注" style="margin-bottom:8px">
  <button class="btn btn-primary btn-sm" onclick="addFinance()">记一笔</button>
  <button class="btn btn-ghost btn-sm" onclick="exportCSV()">📥 导出CSV</button>
  <div style="margin-top:10px;max-height:200px;overflow-y:auto">${finList}</div>
  <canvas id="pieChart" style="max-height:180px;margin-top:10px"></canvas>
</div>`;
}

// ─── TAB 4: STUDY ───
var quizMode='all';
var pomoTimer=null,pomoSec=0,pomoRunning=false,pomoTotal=0;

function studyPage(){
// Subjects from state (editable)
if(!S.subjects||!S.subjects.length)S.subjects=[{n:'Python',p:15},{n:'高等数学',p:10},{n:'CET-4',p:8},{n:'WPS二级',p:12}];
var subColors=['var(--blue2)','var(--pink2)','var(--orange2)','var(--green2)'];
var subsHTML=S.subjects.map(function(s,i){
  return '<div style="margin-bottom:8px"><div style="display:flex;align-items:center;justify-content:space-between;font-size:13px;gap:8px"><span style="flex:1">'+s.n+'</span><button class="btn btn-ghost btn-sm" style="min-width:28px;min-height:28px;padding:0;font-size:14px" onclick="adjProgress('+i+',-5)">−</button><span style="font-weight:700;min-width:32px;text-align:center" id="prog-txt-'+i+'">'+s.p+'%</span><button class="btn btn-ghost btn-sm" style="min-width:28px;min-height:28px;padding:0;font-size:14px" onclick="adjProgress('+i+',5)">+</button></div><div class="progress-bar"><div class="progress-fill" id="prog-'+i+'" style="width:'+s.p+'%;background:'+(subColors[i%4])+'"></div></div></div>'

var exams=[{n:'计算机二级',d:'2026-09-20',c:'var(--orange2)'},{n:'CET-4',d:'2026-12-12',c:'var(--blue2)'},{n:'期末',d:'2027-01-10',c:'var(--pink2)'}];
var td=today();
var qlist=S.quiz;if(quizMode==='wrong')qlist=S.quiz.filter(function(q){return q.user!==null&&q.user!==q.ans});
var qHTML=qlist.map(function(q,i){return'<div class="quiz-card"><div style="font-size:12px;color:var(--text2)">'+q.subj+' · 第'+(i+1)+'题</div><div style="font-weight:600;margin:6px 0">'+q.q+'</div>'+q.opts.map(function(o,j){return'<div class="quiz-opt'+(q.user!==null?(j===q.ans?' correct':j===q.user&&j!==q.ans?' wrong':''):'')+'" onclick="answerQuiz('+q.id+','+j+')">'+('ABCD'[j])+'. '+o+'</div>'}).join('')+(q.user!==null?(q.user===q.ans?'<div style="color:#4a9a6a;font-weight:600;margin-top:4px">✅ 正确！</div>':'<div style="color:#c06050;font-weight:600;margin-top:4px">❌ 正确答案是 '+String.fromCharCode(65+q.ans)+'</div>'):'')+'</div>'}).join('');

// Vocab heatmap
var vHTML='';var nowD=new Date();for(var i=29;i>=0;i--){var d=new Date(nowD);d.setDate(d.getDate()-i);var ds=d.getFullYear()+'-'+fmt(d.getMonth()+1)+'-'+fmt(d.getDate());var cnt=S.vocabLog[ds]||0;var alpha=cnt>0?Math.min(0.3+cnt*0.07,1):0.05;vHTML+='<span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--green2);opacity:'+alpha+';margin:1px" title="'+ds+': '+cnt+'词"></span>'}

var pomoInit=pomoTotal||0;var pomoShow=pomoRunning?pomoSec:pomoInit;

return`
<div class="card"><h3>📊 科目进度</h3>${subsHTML}</div>
<div class="card"><h3>🍅 番茄钟</h3>
  <div style="text-align:center;padding:8px 0">
    <div style="margin-bottom:8px"><span id="pomoTime" style="font-size:32px;font-weight:800;color:${pomoRunning?'var(--pink2)':'var(--gray2)'}">${fmt(Math.floor(pomoShow/60))}:${fmt(pomoShow%60)}</span></div>
    <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px">
      <button class="btn btn-ghost btn-sm" onclick="setPomo(25)">25分钟</button>

    </div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn btn-primary btn-sm" onclick="togglePomo()" id="pomoBtn">${pomoRunning?'⏸ 暂停':'▶ 开始'}</button>
      <button class="btn btn-ghost btn-sm" onclick="resetPomo()">↺ 重置</button>
    </div>
    <div id="pomoDone" style="font-size:11px;color:var(--text2);margin-top:6px;display:${pomoRunning?'block':'none'}">🔔 结束后会弹出提醒</div>
  </div>
</div>
<div class="card"><h3>🗓️ 开学考冲刺期 (8/6 ~ 开学)</h3>
  <div style="font-size:12px;color:var(--text2);margin-bottom:8px">🔴英语冲A班 + 🟡计算机免修 + 🟢Python保持</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px">

    <div style="padding:6px 8px;background:var(--orange);border-radius:8px">💻 计算机: WPS操作+真题</div>
    <div style="padding:6px 8px;background:var(--blue);border-radius:8px">🐍 Python: input/布尔/if</div>
    <div style="padding:6px 8px;background:var(--green);border-radius:8px">📖 四级单词 50词/天</div>
  </div>
  <div style="margin-top:6px;font-size:11px;color:var(--text2)">📌 高数暂时搁置，开学后跟课学习效率更高</div>
</div>
<div class="card"><h3>⏰ 考试倒计时</h3>${exams.map(function(e){var d=daysBetween(td,e.d);return'<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0"><span>'+e.n+'</span><span style="font-weight:700;font-size:18px;color:'+e.c+'">'+d+'天</span></div>'}).join('')}</div>
<div class="card"><h3>📝 刷题</h3><div style="display:flex;gap:6px;margin-bottom:8px"><select id="quizFilter" onchange="quizMode=this.value;render();attachEvents()" style="width:auto"><option value="all">全部</option><option value="wrong">错题集</option></select><button class="btn btn-ghost btn-sm" onclick="addQuiz()">+ 添加题目</button></div><div id="quizArea">${qHTML}</div></div>
<div class="card"><h3>📖 单词打卡</h3><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><input id="vocabCount" type="number" value="50" style="width:70px;flex:0" placeholder="词数"><button class="btn btn-primary btn-sm" onclick="logVocab()">打卡</button></div><div style="overflow-x:auto;white-space:nowrap">${vHTML}</div></div>`;

// ─── TAB 5: REVIEW ───
function reviewPage(){
var td2=today();var todayRev=S.reviews.find(function(r){return r.date===td2})||{date:td2,highlight:'',weakness:'',tomorrow:'',mood:'😊'};
var nHTML=S.notes.sort(function(a,b){return b.date.localeCompare(a.date)}).slice(0,10).map(function(n){return'<div class="card" style="padding:12px" id="note-'+n.id+'"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;color:var(--text2)">'+n.date+' · '+(n.type==='inspiration'?'💡灵感':'📋会议')+'</span><div style="display:flex;gap:4px"><span style="cursor:pointer;font-size:13px;color:var(--blue2);padding:4px" onclick="editNote('+n.id+')">✎</span><span class="del" style="cursor:pointer;padding:4px" onclick="delNote(\''+n.id+'\')">×</span></div></div><div style="font-weight:600;font-size:14px" id="note-title-'+n.id+'">'+n.title+'</div><div style="font-size:13px;color:var(--text2);white-space:pre-wrap" id="note-content-'+n.id+'">'+n.content+'</div></div>'}).join('');
// History section
var history=S.reviews.filter(function(r){return r.date!==td2}).sort(function(a,b){return b.date.localeCompare(a.date)}).slice(0,7);
var histHTML=history.length?history.map(function(r){return'<div class="card" style="padding:12px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:13px;font-weight:700">'+h(r.date)+'</span><span style="font-size:20px">'+r.mood+'</span></div><div style="font-size:12px"><div style="margin-bottom:3px"><span style="color:var(--green2)">🌟</span> '+r.highlight+'</div><div style="margin-bottom:3px"><span style="color:var(--orange2)">💪</span> '+r.weakness+'</div><div style="margin-bottom:3px"><span style="color:var(--blue2)">🎯</span> '+r.tomorrow+'</div></div></div>'}).join(''):'<div style="text-align:center;color:var(--text2);padding:16px;font-size:13px">还没有历史记录，今天开始写吧 ✍️</div>';
return`

// Countdown management
window.addCountdown=function(){var t=prompt('倒计时名称：');if(!t)return;var d=prompt('日期（2026-12-12）：');if(!d)return;var cd={id:Date.now(),title:t,date:d,color:'var(--pink2)'};S.countdowns.push(cd);save();
  var td=today();var days=daysBetween(td,cd.date);var c=days<=7?'#e8a0b4':days<=30?'var(--orange2)':'var(--green2)';
  var row=document.querySelector('.countdown-row');if(!row)return;
  var card=document.createElement('div');card.className='cd-card';card.style.cssText='background:'+c+'15;position:relative;animation:cardIn .3s ease-out';
  card.innerHTML='<span style="position:absolute;top:4px;right:8px;font-size:14px;color:var(--gray2);cursor:pointer" onclick="event.stopPropagation();delCountdown('+cd.id+')">×</span><div class="cd-num" style="color:'+c+'">'+days+'</div><div style="font-size:13px;font-weight:600">'+cd.title+'</div><div class="cd-label">天后</div>';
  row.appendChild(card)};
window.delCountdown=function(id){if(!confirm('删除这个倒计时？'))return;S.countdowns=S.countdowns.filter(function(c){return c.id!==id});save();var card=document.querySelector('.cd-card[onclick*="'+id+'"]');if(!card)card=document.querySelector('.cd-card span[onclick*="'+id+'"]');if(card){card.style.opacity='0';card.style.transform='scale(0.8)';card.style.transition='.2s';setTimeout(function(){if(card.parentNode)card.parentNode.removeChild(card)},200)}};

// Finance delete
window.delFinance=function(id){if(!confirm('删除这条记录？'))return;S.finances=S.finances.filter(function(f){return f.id!==id});save();var el=document.getElementById('fin-'+id);if(el){el.style.opacity='0';el.style.transform='translateX(20px)';el.style.transition='.2s';setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);drawPie()},200)}};

// ═══════════════ ACTIONS ═══════════════
function attachEvents(){
document.querySelectorAll('.nav-item').forEach(b=>b.onclick=function(){
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));this.classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(['page-home','page-cal','page-task','page-study','page-review'][parseInt(this.dataset.tab)]).classList.add('active');
  if(this.dataset.tab==='2')initKanban();if(this.dataset.tab==='3')drawPie();
});

document.querySelectorAll('.check-row input[type=checkbox]').forEach(cb=>cb.onchange=function(){
  var tid=parseInt(this.dataset.tid);var t=S.tasks.find(t=>t.id===tid);if(t){t.done=this.checked;save()}
  var label=this.parentNode.querySelector('.check-label');if(label){if(this.checked)label.style.cssText='text-decoration:line-through;color:var(--gray2)';else label.style.cssText='text-decoration:none;color:var(--text)'}
  if(this.checked&&S.tasks.filter(function(t){return !t.done}).length===0){confetti({particleCount:120,spread:80,origin:{y:0.6},colors:['#e8a0b4','#f0d58c','#8cc9a8','#d4eaf5']});setTimeout(function(){confetti({particleCount:60,spread:100,origin:{y:0.5},colors:['#ffb5c2','#ffeaa7']})},300)}
});

} // <-- closes attachEvents

// Pomodoro timer (requestAnimationFrame for 60fps smoothness)
window.setPomo=function(min){pomoTotal=min*60;pomoSec=pomoTotal;pomoRunning=false;if(pomoTimer)cancelAnimationFrame(pomoTimer);pomoTimer=null;updatePomoDisplay()};
window.togglePomo=function(){
  if(!pomoTotal){var custom=$('#customPomo');var cmin=parseInt(custom&&custom.value)||25;pomoTotal=cmin*60;pomoSec=pomoTotal}
  if(pomoRunning){pomoRunning=false;if(pomoTimer)cancelAnimationFrame(pomoTimer);pomoTimer=null;updatePomoDisplay();return}
  pomoRunning=true;
  var lastTick=performance.now();
  function tick(now){
    if(!pomoRunning)return;
    if(now-lastTick>=1000){pomoSec--;lastTick=now;updatePomoDisplay()}
    if(pomoSec<=0){pomoRunning=false;updatePomoDisplay();
      if(typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate([200,100,200]);
      setTimeout(function(){alert('🍅 番茄钟完成！休息一下吧~')},100);return}
    pomoTimer=requestAnimationFrame(tick)
  }
  updatePomoDisplay();pomoTimer=requestAnimationFrame(tick)
};
window.resetPomo=function(){pomoRunning=false;if(pomoTimer)cancelAnimationFrame(pomoTimer);pomoTimer=null;pomoSec=0;pomoTotal=0;updatePomoDisplay()};

function updatePomoDisplay(){
  var el=document.getElementById('pomoTime');if(!el)return;
  var sec=pomoSec||pomoTotal||0;
  var m=Math.floor(sec/60),s=sec%60;
  el.textContent=fmt(m)+':'+fmt(s);
  el.style.color=pomoRunning?'var(--pink2)':'var(--gray2)';
  if(pomoRunning){el.classList.add('pomo-live')}else{el.classList.remove('pomo-live')}
  var btn=document.getElementById('pomoBtn');if(btn)btn.textContent=pomoRunning?'⏸ 暂停':'▶ 开始';
  var tip=document.getElementById('pomoDone');if(tip)tip.style.display=pomoRunning?'block':'none';
}

  if(elT)elT.value='';if(elC)elC.value=''};
window.delNote=function(id){S.notes=S.notes.filter(function(n){return n.id!==id});save();var card=document.getElementById('note-'+id);if(card){card.style.opacity='0';card.style.transition='.2s';setTimeout(function(){if(card.parentNode)card.parentNode.removeChild(card)},200)}};
window.editNote=function(id){var n=S.notes.find(function(x){return x.id===id});if(!n)return;var tel=document.getElementById('note-title-'+id);var cel=document.getElementById('note-content-'+id);if(!tel||!cel)return;
  // Swap to inputs
  tel.innerHTML='<input id="et-'+id+'" value="'+n.title.replace(/"/g,'&quot;')+'" style="font-size:14px;font-weight:600;padding:4px 8px;margin:-4px">';
  cel.innerHTML='<textarea id="ec-'+id+'" style="font-size:13px;width:100%;min-height:60px;padding:6px 8px;margin:-4px;resize:vertical;font-family:inherit">'+n.content.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</textarea>';
  // Change edit button to save
  var card=document.getElementById('note-'+id);if(!card)return;
  var editBtn=card.querySelector('[onclick^="editNote"]');if(editBtn){editBtn.textContent='💾';editBtn.onclick=function(){saveNote(id);return false}}
};
window.saveNote=function(id){var n=S.notes.find(function(x){return x.id===id});if(!n)return;
  var ti=document.getElementById('et-'+id);var co=document.getElementById('ec-'+id);
  if(ti)n.title=ti.value;if(co)n.content=co.value;save();
  var tel=document.getElementById('note-title-'+id);var cel=document.getElementById('note-content-'+id);
  if(tel)tel.textContent=n.title;if(cel){cel.style.whiteSpace='pre-wrap';cel.textContent=n.content}
  var card=document.getElementById('note-'+id);if(!card)return;
  var saveBtn=card.querySelector('[onclick^="saveNote"]');if(saveBtn){saveBtn.textContent='✎';saveBtn.onclick=function(){editNote(id);return false}}
};

// Modal
window.showModal=function(html){document.getElementById('modalContainer').innerHTML=`<div class="modal-overlay" onclick="this.remove()"><div class="modal" onclick="event.stopPropagation()">${html}<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:12px" onclick="document.getElementById('modalContainer').innerHTML=''">关闭</button></div></div>`};

// ═══════════════ DATA MANAGEMENT ═══════════════
window.exportJSON=function(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='全能管家备份_'+today()+'.json';a.click()};
window.importJSON=function(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=function(e){const file=e.target.files[0];const reader=new FileReader();reader.onload=function(evt){try{const data=JSON.parse(evt.target.result);S=data;save();render();attachEvents();alert('✅ 数据已导入！')}catch(ex){alert('❌ 文件格式错误')}};reader.readAsText(file)};input.click()};

function globalActions(){return`
<div style="padding:0 16px 16px;text-align:center">
  <button class="btn btn-ghost btn-sm" onclick="exportJSON()">📤 导出JSON</button>
  <button class="btn btn-ghost btn-sm" onclick="importJSON()">📥 导入JSON</button>
</div>`}

// ═══════════════ CDN-DEPENDENT (safe fallback) ═══════════════
window.initKanban=function(){
  // Simple touch drag for kanban cards
  document.querySelectorAll('.kb-card').forEach(function(card){
    card.addEventListener('touchstart',function(e){if(e.target.classList.contains('del')||e.target.classList.contains('tomato'))return;
      card._dragStart=e.touches[0];card.style.opacity='0.6';card.style.zIndex='10'});
    card.addEventListener('touchmove',function(e){if(!card._dragStart)return;
      card.style.position='relative';card.style.left=(e.touches[0].clientX-card._dragStart.clientX)+'px';card.style.top=(e.touches[0].clientY-card._dragStart.clientY)+'px'});
    card.addEventListener('touchend',function(e){if(!card._dragStart)return;
      card.style.opacity='';card.style.zIndex='';card.style.position='';card.style.left='';card.style.top='';
      var target=document.elementFromPoint(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
      var col=target?target.closest('.kb-list'):null;
      if(col&&col!==card.parentNode){var id=parseInt(card.dataset.id);var t=S.tasks.find(function(t){return t.id===id});if(t){t.cat=col.dataset.cat;save();col.appendChild(card);initKanban()}}
      card._dragStart=null})
  })
};

window.drawPie=function(){
  var mf=S.finances.filter(function(f){return f.date.startsWith(now().getFullYear()+'-'+fmt(now().getMonth()+1))&&f.type==='expense'});
  var cat={};mf.forEach(function(f){cat[f.cat]=(cat[f.cat]||0)+f.amount});
  var labels=Object.keys(cat);var values=Object.values(cat);
  drawPieChart('pieChart',{labels:labels,values:values});
};

// ═══════════════ BOOT ═══════════════
try{
  render();
  var loadEl=document.getElementById('loading');if(loadEl)loadEl.style.display='none';
  document.getElementById('page-home').insertAdjacentHTML('beforeend',globalActions());
  setTimeout(function(){drawPie();initKanban()},600);
}catch(e){
  var box=document.getElementById('errbox');
  if(box){box.style.display='block';box.innerHTML='<b>❌ Boot Error:</b><br>'+e.message+'<br><pre>'+e.stack+'</pre>'}
  var loadEl2=document.getElementById('loading');if(loadEl2)loadEl2.style.display='none';
}

// Auto-save on beforeunload
window.addEventListener('beforeunload',save);
</script>
